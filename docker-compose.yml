services:
  mysql:
    image: mysql:8.0
    container_name: library-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: lib_db
      MYSQL_USER: library_user
      MYSQL_PASSWORD: library123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - library-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build: .
    container_name: library-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Database
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/lib_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: library_user
      SPRING_DATASOURCE_PASSWORD: library123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_THYMELEAF_CACHE: "true"

      # Server
      SERVER_PORT: 8080

      # DataLoader
      DATALOADER_ENABLED: "true"

      # AI
      AI_API_KEY: ${AI_API_KEY}

      # Firebase
      FIREBASE_ENABLED: "true"

      # M-Pesa
      MPESA_ENABLED: "true"
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET}
      MPESA_SHORTCODE: "174379"
      MPESA_PASSKEY: "bfb279f9aa9bdbcf158e97dd71a467cd2e0c893059b10f78e6b72ada1ed2c919"
      MPESA_CALLBACK_URL: ${MPESA_CALLBACK_URL}
      MPESA_ENV: "sandbox"
    ports:
      - "8080:8080"
    networks:
      - library-network

volumes:
  mysql_data:

networks:
  library-network:
    driver: bridge
# ============================================
# Test Profile Configuration
# ============================================
# Uses H2 in-memory database for faster tests
# ============================================

# ============================================
# H2 Database Configuration
# ============================================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ============================================
# JPA & Hibernate Configuration
# ============================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true

# ============================================
# H2 Console (for debugging)
# ============================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=false
spring.h2.console.settings.web-allow-others=false

# ============================================
# Logging Configuration
# ============================================
logging.level.org.springframework=INFO
logging.level.org.springframework.boot.test=DEBUG
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.security=INFO
logging.level.com.library=DEBUG
logging.level.org.springframework.test.context=DEBUG

# ============================================
# Test Specific Settings
# ============================================
spring.main.allow-bean-definition-overriding=true
spring.main.lazy-initialization=false

# ============================================
# JPA Properties for Tests
# ============================================
spring.jpa.properties.jakarta.persistence.schema-generation.database.action=drop-and-create
spring.jpa.properties.hibernate.hbm2ddl.auto=create-drop

# ============================================
# Spring Boot Test Properties
# ============================================
spring.test.database.replace=AUTO
spring.test.constructor.autowire.mode=ALL

# ============================================
# Transaction Management
# ============================================
spring.transaction.default-timeout=60
spring.transaction.rollback-on-commit-failure=true

# ============================================
# Validation
# ============================================
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
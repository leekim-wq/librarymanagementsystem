<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Smart Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            min-height: 100%;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 30px 20px;
            overflow-x: hidden;
        }

        /* Floating shapes */
        .shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.15;
            animation: float 25s infinite ease-in-out;
            pointer-events: none;
        }
        .shape:nth-child(1) {
            width: 400px; height: 400px;
            background: radial-gradient(circle, #667eea, transparent);
            top: -100px; left: -100px;
        }
        .shape:nth-child(2) {
            width: 500px; height: 500px;
            background: radial-gradient(circle, #e94560, transparent);
            bottom: -200px; right: -150px;
            animation-delay: -8s;
        }
        .shape:nth-child(3) {
            width: 300px; height: 300px;
            background: radial-gradient(circle, #11998e, transparent);
            top: 30%; right: 20%;
            animation-delay: -15s;
        }
        @keyframes float {
            0%, 100% { transform: translate(0,0) scale(1); }
            33% { transform: translate(40px,-30px) scale(1.1); }
            66% { transform: translate(-30px,40px) scale(0.9); }
        }

        /* Register card */
        .register-wrapper {
            width: 100%;
            max-width: 560px;
            position: relative;
            z-index: 10;
            animation: slideUp 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .register-card {
            background: rgba(255,255,255,0.98);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 44px 44px 38px;
            box-shadow:
                    0 30px 80px rgba(0,0,0,0.5),
                    0 0 0 1px rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
        }
        .register-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 5px;
            background: linear-gradient(90deg, #11998e, #38ef7d, #667eea, #11998e);
            background-size: 300% 100%;
            animation: gradientShift 4s linear infinite;
        }
        @keyframes gradientShift {
            0%   { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        .register-icon {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, #11998e, #38ef7d);
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 22px;
            color: #fff;
            font-size: 2.2rem;
            box-shadow: 0 15px 35px rgba(17,153,142,0.4);
            transform: rotate(-3deg);
            transition: transform 0.4s;
        }
        .register-card:hover .register-icon {
            transform: rotate(3deg) scale(1.05);
        }

        .register-card h2 {
            font-weight: 900;
            color: #1a1a2e;
            font-size: 1.9rem;
            margin-bottom: 6px;
            text-align: center;
            letter-spacing: -0.5px;
        }
        .register-card .subtitle {
            color: #6c757d;
            text-align: center;
            margin-bottom: 26px;
            font-size: 0.95rem;
        }

        /* Form */
        .form-label {
            font-weight: 600;
            color: #1a1a2e;
            font-size: 0.88rem;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .form-label i { color: #11998e; font-size: 0.85rem; }

        .input-group-custom { position: relative; }
        .input-group-custom .form-control {
            border-radius: 14px;
            padding: 13px 48px 13px 18px;
            border: 2px solid #e9ecef;
            transition: all 0.3s;
            font-size: 0.95rem;
            background: #f8f9fa;
        }
        .input-group-custom .form-control:focus {
            border-color: #11998e;
            box-shadow: 0 0 0 4px rgba(17,153,142,0.15);
            background: #fff;
            outline: none;
        }
        .input-group-custom .form-control::placeholder { color: #adb5bd; }

        .input-icon-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #adb5bd;
            cursor: pointer;
            font-size: 1rem;
            padding: 5px;
            transition: color 0.3s;
            z-index: 5;
        }
        .input-icon-btn:hover { color: #11998e; }

        /* Password strength */
        .password-strength {
            height: 6px;
            border-radius: 5px;
            margin-top: 8px;
            transition: width 0.4s, background 0.4s;
            background: #e9ecef;
            width: 0%;
        }
        .strength-text {
            font-size: 0.75rem;
            font-weight: 600;
            color: #adb5bd;
            margin-top: 4px;
            display: block;
        }

        /* Submit button */
        .btn-register {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            border: none;
            color: #fff;
            padding: 15px;
            border-radius: 50px;
            width: 100%;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 0.4px;
            transition: all 0.3s;
            box-shadow: 0 8px 25px rgba(17,153,142,0.35);
            margin-top: 8px;
        }
        .btn-register:hover {
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(17,153,142,0.5);
        }

        /* Alerts */
        .alert {
            border-radius: 14px;
            border: none;
            font-size: 0.9rem;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideDown 0.4s ease;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .alert-danger  { background: #fef2f2; color: #991b1b; }
        .alert-success { background: #f0fdf4; color: #166534; }
        .alert-info    { background: #eff6ff; color: #1e40af; }

        /* Links */
        .link {
            color: #11998e;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s;
        }
        .link:hover { color: #38ef7d; text-decoration: underline; }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #6c757d;
            font-size: 0.85rem;
            text-decoration: none;
            transition: color 0.3s;
        }
        .back-link:hover { color: #11998e; }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #adb5bd;
            font-size: 0.8rem;
            margin: 22px 0;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e9ecef;
        }
        .divider span { padding: 0 12px; }

        /* Row split */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        @media (max-width: 576px) {
            .form-row { grid-template-columns: 1fr; }
            .register-card { padding: 32px 26px; border-radius: 24px; }
            .register-card h2 { font-size: 1.6rem; }
            .register-icon { width: 65px; height: 65px; font-size: 1.8rem; }
        }
    </style>
</head>
<body>

<!-- Floating shapes -->
<div class="shape"></div>
<div class="shape"></div>
<div class="shape"></div>

<!-- Register card -->
<div class="register-wrapper">
    <div class="register-card">
        <div class="register-icon">
            <i class="fas fa-user-plus"></i>
        </div>

        <h2>Create Account</h2>
        <p class="subtitle">Join the Smart Library community</p>

        <!-- Alerts -->
        <div th:if="${error}" class="alert alert-danger mb-3">
            <i class="fas fa-exclamation-circle"></i>
            <span th:text="${error}">Error</span>
        </div>
        <div th:if="${success}" class="alert alert-success mb-3">
            <i class="fas fa-check-circle"></i>
            <span th:text="${success}">Success</span>
        </div>

        <!-- ============================================ -->
        <!-- REGISTER FORM                                 -->
        <!-- ============================================ -->
        <form th:action="@{/register}" method="post" autocomplete="off" id="registerForm">
            <!-- Disable autofill -->
            <input type="text" style="display:none" autocomplete="username">
            <input type="password" style="display:none" autocomplete="new-password">

            <!-- Username & Full Name (side by side on desktop) -->
            <div class="form-row mb-3">
                <div>
                    <label class="form-label">
                        <i class="fas fa-user"></i> Username
                    </label>
                    <div class="input-group-custom">
                        <input type="text"
                               name="username"
                               class="form-control"
                               placeholder="Choose a username"
                               autocomplete="off"
                               autocapitalize="off"
                               spellcheck="false"
                               required>
                    </div>
                </div>
                <div>
                    <label class="form-label">
                        <i class="fas fa-id-card"></i> Full Name
                    </label>
                    <div class="input-group-custom">
                        <input type="text"
                               name="name"
                               class="form-control"
                               placeholder="Your full name"
                               autocomplete="off"
                               required>
                    </div>
                </div>
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label class="form-label">
                    <i class="fas fa-envelope"></i> Email Address
                </label>
                <div class="input-group-custom">
                    <input type="email"
                           name="email"
                           class="form-control"
                           placeholder="you@example.com"
                           autocomplete="off"
                           required>
                </div>
            </div>

            <!-- Phone & Address -->
            <div class="form-row mb-3">
                <div>
                    <label class="form-label">
                        <i class="fas fa-phone"></i> Phone <small class="text-muted">(optional)</small>
                    </label>
                    <div class="input-group-custom">
                        <input type="tel"
                               name="phone"
                               class="form-control"
                               placeholder="+254..."
                               autocomplete="off">
                    </div>
                </div>
                <div>
                    <label class="form-label">
                        <i class="fas fa-map-marker-alt"></i> Address <small class="text-muted">(optional)</small>
                    </label>
                    <div class="input-group-custom">
                        <input type="text"
                               name="address"
                               class="form-control"
                               placeholder="Your address"
                               autocomplete="off">
                    </div>
                </div>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label class="form-label">
                    <i class="fas fa-lock"></i> Password
                </label>
                <div class="input-group-custom">
                    <input type="password"
                           id="password"
                           name="password"
                           class="form-control"
                           placeholder="Create a strong password"
                           autocomplete="new-password"
                           minlength="6"
                           required>
                    <button type="button"
                            class="input-icon-btn"
                            onclick="togglePassword()"
                            title="Show / Hide password">
                        <i id="toggleIcon" class="fas fa-eye"></i>
                    </button>
                </div>
                <div class="password-strength" id="strengthBar"></div>
                <small class="strength-text" id="strengthText">Enter a strong password</small>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn-register">
                <i class="fas fa-user-plus"></i> Create Account
            </button>
        </form>

        <!-- Footer -->
        <div class="divider"><span>OR</span></div>

        <div class="text-center">
            <p class="text-muted mb-2" style="font-size: 0.9rem;">
                Already have an account?
                <a href="/login" class="link">Sign in</a>
            </p>
            <a href="/" class="back-link">
                <i class="fas fa-arrow-left"></i> Back to Home
            </a>
        </div>
    </div>
</div>

<script>
    // ============================================
    // SHOW / HIDE PASSWORD
    // ============================================
    function togglePassword() {
        const input = document.getElementById('password');
        const icon  = document.getElementById('toggleIcon');
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }

    // ============================================
    // PASSWORD STRENGTH METER
    // ============================================
    const passwordInput = document.getElementById('password');
    const strengthBar   = document.getElementById('strengthBar');
    const strengthText  = document.getElementById('strengthText');

    passwordInput.addEventListener('input', function() {
        const pwd = this.value;
        let strength = 0;

        if (pwd.length >= 6) strength++;
        if (pwd.length >= 8) strength++;
        if (/[a-z]/.test(pwd) && /[A-Z]/.test(pwd)) strength++;
        if (/\d/.test(pwd)) strength++;
        if (/[@$!%*?&#^()_\-+=]/.test(pwd)) strength++;

        const percentage = Math.min((strength / 5) * 100, 100);
        const colors = ['#e74c3c', '#e67e22', '#f1c40f', '#2ecc71', '#27ae60'];
        const labels = ['Very Weak', 'Weak', 'Fair', 'Good', 'Strong'];
        const idx = Math.min(strength, 4);

        strengthBar.style.width = percentage + '%';
        strengthBar.style.background = colors[idx];
        strengthText.textContent = labels[idx] + ' (' + Math.round(percentage) + '%)';
        strengthText.style.color = colors[idx];
    });

    // ============================================
    // DISABLE BROWSER AUTOFILL ON LOAD
    // ============================================
    window.addEventListener('load', function() {
        setTimeout(function() {
            document.querySelectorAll('input').forEach(function(input) {
                if (input.type !== 'submit' && input.type !== 'button' && input.type !== 'hidden') {
                    input.value = '';
                }
            });
        }, 100);
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Smart Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Same background and card styling as login, with floating shapes */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.1;
            animation: float 20s infinite ease-in-out;
        }
        .shape:nth-child(1) { width: 300px; height: 300px; background: #667eea; top: -100px; left: -100px; }
        .shape:nth-child(2) { width: 400px; height: 400px; background: #e94560; bottom: -150px; right: -150px; animation-delay: -5s; }
        .shape:nth-child(3) { width: 200px; height: 200px; background: #f39c12; top: 50%; left: 50%; animation-delay: -10s; }
        @keyframes float {
            0%, 100% { transform: translate(0,0) scale(1); }
            25% { transform: translate(30px,-20px) scale(1.1); }
            50% { transform: translate(-20px,30px) scale(0.9); }
            75% { transform: translate(20px,20px) scale(1.05); }
        }

        .register-card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            padding: 40px 50px;
            max-width: 560px;
            width: 100%;
            box-shadow: 0 30px 80px rgba(0,0,0,0.5);
            position: relative;
            z-index: 10;
            animation: slideUp 0.8s ease;
            margin: 30px 0;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .form-control {
            border-radius: 15px;
            padding: 14px 20px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102,126,234,0.15);
        }
        .btn-gradient {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 14px;
            border-radius: 50px;
            width: 100%;
            font-weight: 700;
            transition: all 0.3s;
        }
        .btn-gradient:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(102,126,234,0.4);
            color: white;
        }
        .link { color: #667eea; font-weight: 600; text-decoration: none; }
        .link:hover { text-decoration: underline; }
        .password-strength {
            height: 6px;
            border-radius: 5px;
            margin-top: 8px;
            transition: width 0.3s, background 0.3s;
            background: #e0e0e0;
        }
        .strength-text { font-size: 0.75rem; font-weight: 600; }
        .alert { border-radius: 15px; }
    </style>
</head>
<body>
<div class="shape"></div>
<div class="shape"></div>
<div class="shape"></div>

<div class="container">
    <div class="register-card">
        <div class="text-center mb-4">
            <i class="fas fa-user-plus" style="font-size: 3rem; color: #667eea;"></i>
            <h3 class="fw-bold">Create Account</h3>
            <p class="text-muted">Join the Smart Library community</p>
        </div>

        <!-- Messages -->
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${error}">Error</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
            <i class="fas fa-check-circle"></i> <span th:text="${success}">Success</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Registration Form -->
        <form action="/register" method="post">
            <div class="mb-3">
                <label class="form-label fw-bold">Username</label>
                <input type="text" name="username" class="form-control"
                       placeholder="Choose a unique username" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Full Name</label>
                <input type="text" name="name" class="form-control"
                       placeholder="Enter your full name" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Email Address</label>
                <input type="email" name="email" class="form-control"
                       placeholder="Enter your email" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Phone Number</label>
                <input type="tel" name="phone" class="form-control"
                       placeholder="Enter your phone number">
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Address</label>
                <input type="text" name="address" class="form-control"
                       placeholder="Enter your address">
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Password</label>
                <input type="password" id="password" name="password" class="form-control"
                       placeholder="Min 8 chars, with uppercase, lowercase, digit & special" required>
                <div class="password-strength mt-2" id="strengthBar"></div>
                <small class="strength-text" id="strengthText">Enter a strong password</small>
            </div>

            <button type="submit" class="btn btn-gradient">
                <i class="fas fa-user-plus"></i> Register
            </button>
        </form>

        <div class="text-center mt-3">
            <p class="text-muted">Already have an account?
                <a href="/login" class="link">Sign In</a>
            </p>
            <a href="/" class="text-muted small"><i class="fas fa-arrow-left"></i> Back to Home</a>
        </div>
    </div>
</div>

<script>
    // Password strength meter
    document.getElementById('password').addEventListener('input', function() {
        const pwd = this.value;
        const bar = document.getElementById('strengthBar');
        const text = document.getElementById('strengthText');

        let strength = 0;
        if (pwd.length >= 8) strength++;
        if (/[a-z]/.test(pwd) && /[A-Z]/.test(pwd)) strength++;
        if (/\d/.test(pwd)) strength++;
        if (/[@$!%*?&]/.test(pwd)) strength++;

        const percentage = (strength / 4) * 100;
        bar.style.width = percentage + '%';

        const colors = ['#e74c3c', '#e67e22', '#f1c40f', '#2ecc71', '#27ae60'];
        const labels = ['Weak', 'Fair', 'Good', 'Strong', 'Very Strong'];
        const idx = Math.min(strength, 4);
        bar.style.background = colors[idx];
        text.textContent = labels[idx] + ' (' + (strength*25) + '%)';
        text.style.color = colors[idx];
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        body {
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px;
        }

        /* ============================================
           FLOATING BACKGROUND SHAPES
           ============================================ */
        .shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.15;
            animation: float 25s infinite ease-in-out;
            pointer-events: none;
        }
        .shape:nth-child(1) {
            width: 400px; height: 400px;
            background: radial-gradient(circle, #667eea, transparent);
            top: -100px; left: -100px;
        }
        .shape:nth-child(2) {
            width: 500px; height: 500px;
            background: radial-gradient(circle, #e94560, transparent);
            bottom: -200px; right: -150px;
            animation-delay: -8s;
        }
        .shape:nth-child(3) {
            width: 300px; height: 300px;
            background: radial-gradient(circle, #f39c12, transparent);
            top: 40%; left: 55%;
            animation-delay: -15s;
        }
        @keyframes float {
            0%, 100% { transform: translate(0,0) scale(1); }
            33% { transform: translate(40px,-30px) scale(1.1); }
            66% { transform: translate(-30px,40px) scale(0.9); }
        }

        /* ============================================
           LOGIN CARD
           ============================================ */
        .login-wrapper {
            width: 100%;
            max-width: 460px;
            position: relative;
            z-index: 10;
            animation: slideUp 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .login-card {
            background: rgba(255,255,255,0.98);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 48px 44px;
            box-shadow:
                    0 30px 80px rgba(0,0,0,0.5),
                    0 0 0 1px rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
        }
        .login-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 5px;
            background: linear-gradient(90deg, #667eea, #e94560, #f39c12, #667eea);
            background-size: 300% 100%;
            animation: gradientShift 4s linear infinite;
        }
        @keyframes gradientShift {
            0%   { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        /* ============================================
           ICON + HEADER
           ============================================ */
        .login-icon {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 22px;
            color: #fff;
            font-size: 2.2rem;
            box-shadow: 0 15px 35px rgba(102,126,234,0.4);
            transform: rotate(-3deg);
            transition: transform 0.4s;
        }
        .login-card:hover .login-icon {
            transform: rotate(3deg) scale(1.05);
        }

        .login-card h2 {
            font-weight: 900;
            color: #1a1a2e;
            font-size: 1.9rem;
            margin-bottom: 6px;
            text-align: center;
            letter-spacing: -0.5px;
        }
        .login-card .subtitle {
            color: #6c757d;
            text-align: center;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        /* ============================================
           FORM CONTROLS
           ============================================ */
        .form-label {
            font-weight: 600;
            color: #1a1a2e;
            font-size: 0.9rem;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .form-label i { color: #667eea; font-size: 0.85rem; }

        .input-group-custom {
            position: relative;
        }
        .input-group-custom .form-control {
            border-radius: 14px;
            padding: 14px 48px 14px 18px;
            border: 2px solid #e9ecef;
            transition: all 0.3s;
            font-size: 0.95rem;
            background: #f8f9fa;
        }
        .input-group-custom .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102,126,234,0.15);
            background: #fff;
            outline: none;
        }
        .input-group-custom .form-control::placeholder {
            color: #adb5bd;
        }

        /* Right-side toggle icon (password show/hide) */
        .input-icon-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #adb5bd;
            cursor: pointer;
            font-size: 1rem;
            padding: 5px;
            transition: color 0.3s;
            z-index: 5;
        }
        .input-icon-btn:hover { color: #667eea; }

        /* ============================================
           SUBMIT BUTTON
           ============================================ */
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: #fff;
            padding: 15px;
            border-radius: 50px;
            width: 100%;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 0.4px;
            transition: all 0.3s;
            box-shadow: 0 8px 25px rgba(102,126,234,0.35);
            position: relative;
            overflow: hidden;
        }
        .btn-login:hover {
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(102,126,234,0.5);
        }
        .btn-login:active { transform: translateY(-1px); }

        /* ============================================
           ALERTS
           ============================================ */
        .alert {
            border-radius: 14px;
            border: none;
            font-size: 0.9rem;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideDown 0.4s ease;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .alert-danger  { background: #fef2f2; color: #991b1b; }
        .alert-success { background: #f0fdf4; color: #166534; }
        .alert-info    { background: #eff6ff; color: #1e40af; }

        /* ============================================
           LINKS
           ============================================ */
        .link {
            color: #667eea;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s;
        }
        .link:hover {
            color: #764ba2;
            text-decoration: underline;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #6c757d;
            font-size: 0.85rem;
            text-decoration: none;
            transition: color 0.3s;
        }
        .back-link:hover { color: #667eea; }

        /* ============================================
           DIVIDER
           ============================================ */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #adb5bd;
            font-size: 0.8rem;
            margin: 22px 0;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e9ecef;
        }
        .divider span { padding: 0 12px; }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 576px) {
            .login-card { padding: 35px 28px; border-radius: 24px; }
            .login-card h2 { font-size: 1.6rem; }
            .login-icon { width: 65px; height: 65px; font-size: 1.8rem; }
        }
    </style>
</head>
<body>

<!-- Floating background shapes -->
<div class="shape"></div>
<div class="shape"></div>
<div class="shape"></div>

<!-- Login card -->
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-icon">
            <i class="fas fa-book-open"></i>
        </div>

        <h2>Welcome Back</h2>
        <p class="subtitle">Sign in to access your Smart Library</p>

        <!-- ============================================ -->
        <!-- ALERTS                                        -->
        <!-- ============================================ -->
        <div th:if="${param.error}" class="alert alert-danger mb-3">
            <i class="fas fa-exclamation-circle"></i>
            <span>Invalid username or password. Please try again.</span>
        </div>
        <div th:if="${param.logout}" class="alert alert-success mb-3">
            <i class="fas fa-check-circle"></i>
            <span>You have been logged out successfully.</span>
        </div>
        <div th:if="${param.registered}" class="alert alert-success mb-3">
            <i class="fas fa-user-check"></i>
            <span>Registration successful! Please sign in.</span>
        </div>
        <div th:if="${error}" class="alert alert-danger mb-3">
            <i class="fas fa-exclamation-circle"></i>
            <span th:text="${error}">Error</span>
        </div>
        <div th:if="${message}" class="alert alert-info mb-3">
            <i class="fas fa-info-circle"></i>
            <span th:text="${message}">Message</span>
        </div>

        <!-- ============================================ -->
        <!-- LOGIN FORM                                    -->
        <!-- ============================================ -->
        <form th:action="@{/perform_login}" method="post" autocomplete="off">
            <!-- Disable autofill -->
            <input type="text" style="display:none" autocomplete="username">
            <input type="password" style="display:none" autocomplete="current-password">

            <!-- Username / Email -->
            <div class="mb-3">
                <label class="form-label">
                    <i class="fas fa-user"></i> Username or Email
                </label>
                <div class="input-group-custom">
                    <input type="text"
                           name="username"
                           class="form-control"
                           placeholder="Enter your username or email"
                           autocomplete="off"
                           autocapitalize="off"
                           autocorrect="off"
                           spellcheck="false"
                           required autofocus>
                </div>
            </div>

            <!-- Password -->
            <div class="mb-4">
                <label class="form-label">
                    <i class="fas fa-lock"></i> Password
                </label>
                <div class="input-group-custom">
                    <input type="password"
                           id="passwordInput"
                           name="password"
                           class="form-control"
                           placeholder="Enter your password"
                           autocomplete="new-password"
                           required>
                    <button type="button"
                            class="input-icon-btn"
                            onclick="togglePassword()"
                            title="Show / Hide password">
                        <i id="toggleIcon" class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn-login">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>

        <!-- ============================================ -->
        <!-- FOOTER LINKS                                  -->
        <!-- ============================================ -->
        <div class="divider"><span>OR</span></div>

        <div class="text-center">
            <p class="text-muted mb-2" style="font-size: 0.9rem;">
                Don't have an account?
                <a href="/register" class="link">Create one</a>
            </p>
            <a href="/" class="back-link">
                <i class="fas fa-arrow-left"></i> Back to Home
            </a>
        </div>
    </div>
</div>

<script>
    // ============================================
    // SHOW / HIDE PASSWORD
    // ============================================
    function togglePassword() {
        const input = document.getElementById('passwordInput');
        const icon  = document.getElementById('toggleIcon');
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }

    // ============================================
    // DISABLE BROWSER AUTOFILL ON LOAD
    // ============================================
    window.addEventListener('load', function() {
        // Clear any autofilled values
        document.querySelectorAll('input').forEach(function(input) {
            if (input.type !== 'submit' && input.type !== 'button' && input.type !== 'hidden') {
                const originalValue = input.value;
                input.value = '';
                // Restore if user typed (i.e., not autofilled)
                setTimeout(function() {
                    if (input.value === '') {
                        input.value = '';
                    }
                }, 100);
            }
        });
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.1;
            animation: float 20s infinite ease-in-out;
        }
        .shape:nth-child(1) {
            width: 300px;
            height: 300px;
            background: #667eea;
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }
        .shape:nth-child(2) {
            width: 400px;
            height: 400px;
            background: #e94560;
            bottom: -150px;
            right: -150px;
            animation-delay: -5s;
        }
        .shape:nth-child(3) {
            width: 200px;
            height: 200px;
            background: #f39c12;
            top: 50%;
            left: 50%;
            animation-delay: -10s;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -20px) scale(1.1); }
            50% { transform: translate(-20px, 30px) scale(0.9); }
            75% { transform: translate(20px, 20px) scale(1.05); }
        }

        .login-card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            padding: 50px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 30px 80px rgba(0,0,0,0.5);
            position: relative;
            z-index: 10;
            animation: slideUp 0.8s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-icon {
            font-size: 3.5rem;
            color: #667eea;
            background: rgba(102,126,234,0.1);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }
        .form-control {
            border-radius: 15px;
            padding: 14px 20px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s;
            font-size: 1rem;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102,126,234,0.15);
        }
        .btn-gradient {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 14px;
            border-radius: 50px;
            width: 100%;
            font-weight: 700;
            transition: all 0.3s;
            letter-spacing: 0.5px;
        }
        .btn-gradient:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(102,126,234,0.4);
            color: white;
        }
        .alert { border-radius: 15px; }
        .link { color: #667eea; font-weight: 600; text-decoration: none; }
        .link:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="shape"></div>
<div class="shape"></div>
<div class="shape"></div>

<div class="container">
    <div class="login-card">
        <div class="text-center mb-4">
            <div class="login-icon"><i class="fas fa-book-open"></i></div>
            <h3 class="fw-bold">Welcome Back</h3>
            <p class="text-muted">Sign in to your library account</p>
        </div>

        <!-- Messages -->
        <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show">
            <i class="fas fa-exclamation-circle"></i> Invalid credentials!
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${param.logout}" class="alert alert-success alert-dismissible fade show">
            <i class="fas fa-check-circle"></i> Logged out successfully.
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
            <i class="fas fa-check-circle"></i> <span th:text="${success}">Success</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Login Form -->
        <form action="/perform_login" method="post">
            <div class="mb-3">
                <label class="form-label fw-bold"><i class="fas fa-user"></i> Username or Email</label>
                <input type="text" name="username" class="form-control"
                       placeholder="Enter your username or email" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold"><i class="fas fa-lock"></i> Password</label>
                <input type="password" name="password" class="form-control"
                       placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn btn-gradient">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>

        <div class="text-center mt-3">
            <p class="text-muted">Don't have an account?
                <a href="/register" class="link">Register here</a>
            </p>
            <a href="/" class="text-muted small"><i class="fas fa-arrow-left"></i> Back to Home</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

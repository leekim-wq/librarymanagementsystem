<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied - Smart Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-card {
            max-width: 500px;
            background: white;
            border-radius: 30px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .error-icon {
            font-size: 5rem;
            color: #e74c3c;
        }
        .btn-gradient {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 50px;
            transition: all 0.3s;
        }
        .btn-gradient:hover {
            color: white;
            transform: scale(1.02);
        }
    </style>
</head>
<body>
<div class="container">
    <div class="error-card">
        <div class="error-icon">
            <i class="fas fa-ban"></i>
        </div>
        <h1 class="display-4 fw-bold text-danger">Access Denied</h1>
        <p class="lead text-muted">You don't have permission to access this page.</p>
        <p class="text-muted">Please contact the administrator if you think this is a mistake.</p>
        <div class="mt-4">
            <a href="/" class="btn btn-gradient">
                <i class="fas fa-home"></i> Back to Home
            </a>
        </div>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Book - Smart Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ---------- RESET & BASE ---------- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }
        body.dark-mode {
            background: #121212;
            color: #e0e0e0;
        }
        body.dark-mode .navbar-custom { background: #1e1e2f; border-bottom-color: #bb86fc; }
        body.dark-mode .form-card { background: rgba(30,30,47,0.9); color: #e0e0e0; border-color: rgba(255,255,255,0.05); }
        body.dark-mode .form-control { background: #1e1e2f; border-color: #444; color: #fff; }
        body.dark-mode .form-control::placeholder { color: #888; }
        body.dark-mode .form-control:focus { border-color: #667eea; background: #2d2d44; }
        body.dark-mode .form-label { color: #ddd; }
        body.dark-mode .btn-outline-secondary { color: #aaa; border-color: #555; }
        body.dark-mode .btn-outline-secondary:hover { background: #333; color: #fff; }
        body.dark-mode .alert-success { background: #1e3a2f; color: #6fcf97; border-color: #27ae60; }
        body.dark-mode .alert-danger { background: #3a1e1e; color: #ef9a9a; border-color: #e94560; }

        /* ---------- SCROLL ANIMATIONS ---------- */
        .fade-up {
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        .fade-up.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* ---------- NAVBAR (identical to home/books) ---------- */
        .navbar-custom {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            padding: 12px 0;
            box-shadow: 0 4px 30px rgba(0,0,0,0.3);
            border-bottom: 3px solid #e94560;
            position: sticky;
            top: 0;
            z-index: 1050;
            transition: background 0.3s;
        }
        .navbar-custom .navbar-brand {
            font-weight: 900;
            font-size: 1.6rem;
            color: #fff !important;
            letter-spacing: -0.5px;
        }
        .navbar-custom .navbar-brand i { color: #e94560; margin-right: 10px; }
        .navbar-custom .nav-link {
            color: rgba(255,255,255,0.85) !important;
            font-weight: 600;
            transition: all 0.3s;
            padding: 8px 18px;
            border-radius: 25px;
            position: relative;
        }
        .navbar-custom .nav-link:hover {
            color: #fff !important;
            background: rgba(233, 69, 96, 0.2);
            transform: translateY(-2px);
        }
        .navbar-custom .nav-link.active {
            color: #fff !important;
            background: #e94560;
        }
        .navbar-custom .dropdown-menu {
            background: #1a1a2e;
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            padding: 10px 0;
        }
        .navbar-custom .dropdown-item {
            color: #ddd;
            padding: 10px 24px;
            transition: all 0.2s;
            border-radius: 10px;
            margin: 2px 8px;
        }
        .navbar-custom .dropdown-item:hover {
            background: #e94560;
            color: #fff;
        }
        .navbar-custom .dropdown-toggle::after { color: #e94560; }
        .user-badge {
            background: rgba(255,255,255,0.1);
            padding: 6px 16px;
            border-radius: 25px;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.15);
            font-weight: 500;
            font-size: 0.9rem;
        }
        .user-badge i { color: #e94560; margin-right: 8px; }
        .cart-badge {
            background: #e94560;
            color: #fff;
            border-radius: 50%;
            padding: 2px 8px;
            font-size: 0.7rem;
            font-weight: 700;
            margin-left: 5px;
            vertical-align: top;
        }
        .dark-toggle {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            border-radius: 25px;
            padding: 6px 14px;
            transition: 0.3s;
            cursor: pointer;
        }
        .dark-toggle:hover { background: rgba(255,255,255,0.2); }

        /* ---------- PAGE HEADER ---------- */
        .page-header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: white;
            padding: 40px 0 30px;
            margin-bottom: 30px;
            border-radius: 0 0 40px 40px;
            position: relative;
            overflow: hidden;
        }
        .page-header .floating-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }
        .page-header .floating-shapes span {
            position: absolute;
            border-radius: 50%;
            background: rgba(233,69,96,0.06);
            animation: float 20s infinite ease-in-out;
        }
        .page-header .floating-shapes span:nth-child(1) { width: 250px; height: 250px; top: -60px; left: -60px; }
        .page-header .floating-shapes span:nth-child(2) { width: 300px; height: 300px; bottom: -100px; right: -80px; animation-delay: -6s; background: rgba(102,126,234,0.06); }
        .page-header .floating-shapes span:nth-child(3) { width: 150px; height: 150px; top: 30%; left: 70%; animation-delay: -12s; background: rgba(243,156,18,0.05); }
        @keyframes float {
            0% { transform: translate(0,0) scale(1); }
            33% { transform: translate(20px,-30px) scale(1.05); }
            66% { transform: translate(-15px,20px) scale(0.95); }
            100% { transform: translate(0,0) scale(1); }
        }
        .page-header h2 {
            font-weight: 900;
            font-size: 2.2rem;
            letter-spacing: -1px;
            position: relative;
            z-index: 1;
        }
        .page-header p {
            font-size: 1rem;
            opacity: 0.8;
            position: relative;
            z-index: 1;
        }

        /* ---------- FORM CARD (glassmorphism) ---------- */
        .form-card {
            max-width: 640px;
            margin: 0 auto 40px;
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 40px 45px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.08);
            border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.3s;
        }
        .form-card:hover {
            box-shadow: 0 20px 60px rgba(0,0,0,0.12);
        }
        .form-card h2 {
            font-weight: 800;
            color: #1a1a2e;
        }
        .form-card h2 i {
            color: #667eea;
        }

        /* ---------- FORM ELEMENTS ---------- */
        .form-label {
            font-weight: 600;
            color: #2d3748;
            font-size: 0.9rem;
        }
        .form-control {
            border-radius: 15px;
            padding: 14px 20px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s;
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(5px);
            font-size: 0.95rem;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102,126,234,0.12);
            background: #fff;
        }
        textarea.form-control {
            resize: vertical;
            min-height: 80px;
        }

        /* ---------- BUTTONS ---------- */
        .btn-gradient {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: #fff;
            padding: 14px 30px;
            border-radius: 50px;
            font-weight: 700;
            transition: all 0.3s;
            width: 100%;
            font-size: 1rem;
            letter-spacing: 0.3px;
        }
        .btn-gradient:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(102,126,234,0.4);
            color: #fff;
        }
        .btn-outline-secondary {
            border-radius: 50px;
            padding: 14px 30px;
            font-weight: 600;
            transition: all 0.3s;
            width: 100%;
        }
        .btn-outline-secondary:hover {
            transform: scale(1.02);
        }
        .d-grid { gap: 12px; }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 768px) {
            .navbar-custom .navbar-brand { font-size: 1.2rem; }
            .form-card { padding: 25px 20px; margin: 20px 15px; }
            .page-header h2 { font-size: 1.6rem; }
            .page-header { padding: 30px 0; }
        }
        @media (max-width: 576px) {
            .form-card { padding: 20px 15px; }
        }
    </style>
</head>
<body>

<!-- ===== NAVBAR ===== -->
<nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="fas fa-book-open"></i> Smart Library</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-lg-center">
                <li class="nav-item"><a class="nav-link" href="/"><i class="fas fa-home"></i> Home</a></li>
                <li class="nav-item"><a class="nav-link active" href="/books"><i class="fas fa-book"></i> Books</a></li>

                <!-- Cart Link -->
                <li class="nav-item">
                    <a class="nav-link" href="/cart">
                        <i class="fas fa-shopping-cart"></i> Cart
                        <span class="cart-badge" th:text="${cartCount}">0</span>
                    </a>
                </li>

                <!-- Admin Dropdown -->
                <li class="nav-item dropdown" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                        <i class="fas fa-user-shield"></i> Admin
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="/admin/dashboard"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                        <li><a class="dropdown-item" href="/admin/users"><i class="fas fa-users"></i> Manage Users</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="/books/add"><i class="fas fa-plus"></i> Add Book</a></li>
                    </ul>
                </li>

                <!-- Librarian Dropdown -->
                <li class="nav-item dropdown" sec:authorize="hasAnyRole('LIBRARIAN', 'ADMIN')">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                        <i class="fas fa-book-open"></i> Manage
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="/books/add"><i class="fas fa-plus"></i> Add Book</a></li>
                        <li><a class="dropdown-item" href="/books"><i class="fas fa-edit"></i> Edit Books</a></li>
                    </ul>
                </li>

                <!-- My Loans -->
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" href="/loans"><i class="fas fa-hand-holding-heart"></i> My Loans</a>
                </li>

                <!-- User badge -->
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <span class="user-badge">
                        <i class="fas fa-user-circle"></i> <span sec:authentication="name">User</span>
                    </span>
                </li>

                <!-- Dark mode toggle -->
                <li class="nav-item">
                    <button class="dark-toggle" id="darkModeToggle" onclick="toggleDarkMode()">
                        <i class="fas fa-moon"></i>
                    </button>
                </li>

                <!-- Auth -->
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link" href="/login"><i class="fas fa-sign-in-alt"></i> Login</a>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link" href="/register"><i class="fas fa-user-plus"></i> Register</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" href="/logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ===== PAGE HEADER ===== -->
<div class="page-header">
    <div class="floating-shapes">
        <span></span>
        <span></span>
        <span></span>
    </div>
    <div class="container">
        <h2><i class="fas fa-edit"></i> Edit Book</h2>
        <p class="mb-0">Update the details of the selected book</p>
    </div>
</div>

<!-- ===== MAIN CONTENT ===== -->
<div class="container">
    <div class="form-card fade-up">
        <!-- Flash messages -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
            <i class="fas fa-check-circle"></i> <span th:text="${success}">Success</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${error}">Error</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <form th:action="@{/books/edit/{id}(id=${book.id})}" method="post" th:object="${book}">
            <input type="hidden" th:field="*{id}" />

            <div class="mb-3">
                <label class="form-label"><i class="fas fa-heading text-primary"></i> Title</label>
                <input type="text" class="form-control" th:field="*{title}" placeholder="Enter book title" required>
            </div>

            <div class="mb-3">
                <label class="form-label"><i class="fas fa-user text-primary"></i> Author</label>
                <input type="text" class="form-control" th:field="*{author}" placeholder="Enter author name" required>
            </div>

            <div class="mb-3">
                <label class="form-label"><i class="fas fa-tag text-primary"></i> Category</label>
                <input type="text" class="form-control" th:field="*{category}" placeholder="e.g., Programming, Fiction, Science">
            </div>

            <div class="mb-3">
                <label class="form-label"><i class="fas fa-align-left text-primary"></i> Description</label>
                <textarea class="form-control" th:field="*{description}" rows="3" placeholder="Brief description of the book"></textarea>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label"><i class="fas fa-copy text-primary"></i> Total Copies</label>
                    <input type="number" class="form-control" th:field="*{quantity}" min="1" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label"><i class="fas fa-check-circle text-success"></i> Available Copies</label>
                    <input type="number" class="form-control" th:field="*{availableQuantity}" min="0" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label"><i class="fas fa-star text-warning"></i> Rating</label>
                <input type="number" step="0.1" class="form-control" th:field="*{rating}" min="0" max="5" placeholder="0.0 - 5.0">
            </div>

            <div class="d-grid gap-2 mt-4">
                <button type="submit" class="btn btn-gradient">
                    <i class="fas fa-save"></i> Update Book
                </button>
                <a href="/books" class="btn btn-outline-secondary">
                    <i class="fas fa-times"></i> Cancel
                </a>
            </div>
        </form>
    </div>
</div>

<!-- ===== SCRIPTS ===== -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // ---------- DARK MODE TOGGLE ----------
    function toggleDarkMode() {
        document.body.classList.toggle('dark-mode');
        const btn = document.getElementById('darkModeToggle');
        if (document.body.classList.contains('dark-mode')) {
            btn.innerHTML = '<i class="fas fa-sun"></i>';
            localStorage.setItem('darkMode', 'enabled');
        } else {
            btn.innerHTML = '<i class="fas fa-moon"></i>';
            localStorage.setItem('darkMode', 'disabled');
        }
    }

    // Load dark mode preference and scroll animations
    document.addEventListener('DOMContentLoaded', function() {
        // Dark mode
        if (localStorage.getItem('darkMode') === 'enabled') {
            document.body.classList.add('dark-mode');
            document.getElementById('darkModeToggle').innerHTML = '<i class="fas fa-sun"></i>';
        }

        // ---------- SCROLL ANIMATIONS (Intersection Observer) ----------
        const elements = document.querySelectorAll('.fade-up');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, { threshold: 0.1 });
        elements.forEach(el => observer.observe(el));

        // Auto-hide alerts after 5 seconds
        setTimeout(() => {
            document.querySelectorAll('.alert').forEach(a => a.remove());
        }, 5000);
    });
</script>
</body>
</html>

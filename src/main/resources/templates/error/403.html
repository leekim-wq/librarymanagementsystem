<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Access Denied - Smart Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #0f3460);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            color: #fff; margin: 0; padding: 20px;
        }
        .error-card {
            background: rgba(255,255,255,0.05);
            border-radius: 24px; padding: 60px 50px;
            text-align: center; max-width: 500px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .error-icon { font-size: 6rem; color: #e94560; margin-bottom: 20px; }
        .error-code { font-size: 4rem; font-weight: 900; color: #e94560; }
        h3 { font-weight: 700; margin: 10px 0; }
        p { color: rgba(255,255,255,0.7); margin-bottom: 30px; }
        .btn-gradient {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff; padding: 12px 30px; border-radius: 25px;
            font-weight: 700; text-decoration: none; display: inline-block;
        }
        .btn-gradient:hover { color: #fff; transform: translateY(-2px); }
    </style>
</head>
<body>
<div class="error-card">
    <div class="error-icon"><i class="fas fa-shield-alt"></i></div>
    <div class="error-code">403</div>
    <h3>Access Denied</h3>
    <p>You don't have permission to access this page.<br>
        This area is reserved for Librarians and Administrators.</p>
    <a href="/" class="btn-gradient">
        <i class="fas fa-home"></i> Back to Home
    </a>
</div>
</body>
</html>

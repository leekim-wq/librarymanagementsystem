# ============================================
# Application Configuration
# ============================================
spring.application.name=library-management

# ============================================
# Server Configuration
# ============================================
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/
server.address=0.0.0.0

# ============================================
# MySQL Database Configuration
# ============================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/lib_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA & Hibernate Configuration
# ============================================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
# Dialect removed — Hibernate auto-detects MySQL 8

# ============================================
# Connection Pool Configuration
# ============================================
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ============================================
# Thymeleaf Configuration
# ============================================
spring.thymeleaf.cache=${SPRING_THYMELEAF_CACHE:false}
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# ============================================
# Spring Security
# ============================================
spring.security.user.name=${SPRING_SECURITY_USER_NAME:admin}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD:admin123}

# ============================================
# AI Configuration (Google Gemini)
# ============================================
ai.api.key=${AI_API_KEY:}

# ============================================
# JWT Configuration (Mobile Authentication)
# ============================================
jwt.secret=${JWT_SECRET:ChangeThisToALongRandomSecretKeyAtLeast32CharsLongForSecurity!}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ============================================
# IoT Device Configuration
# ============================================
iot.api.key=${IOT_API_KEY:iot_lib_2026_aBcDeFgHiJkLmNoP}
iot.rate.limit.capacity=${IOT_RATE_LIMIT_CAPACITY:100}
iot.rate.limit.refill.minutes=${IOT_RATE_LIMIT_REFILL_MINUTES:1}

# ============================================
# Firebase (Push Notifications - Optional)
# ============================================
firebase.enabled=${FIREBASE_ENABLED:false}

# ============================================
# Logging
# ============================================
logging.level.com.library=${LOGGING_LEVEL_LIBRARY:DEBUG}
logging.level.org.springframework.security=${LOGGING_LEVEL_SECURITY:DEBUG}
logging.level.org.hibernate=${LOGGING_LEVEL_HIBERNATE:WARN}

# ============================================
# Static Resources
# ============================================
spring.web.resources.static-locations=classpath:/static/,classpath:/public/
spring.mvc.static-path-pattern=/**

# ============================================
# File Upload
# ============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================
# DataLoader (optional)
# ============================================
dataloader.enabled=${DATALOADER_ENABLED:true}

# ============================================
# Actuator (Health checks for IoT devices)
# ============================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always